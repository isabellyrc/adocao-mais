<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="css/est_entrada.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

    <div class="estrelinhas" , id="estrelinhas">

    </div>

    <div class="formulario">
        <h1>LOGIN</h1>
        <form action="/login">
            <div class="caixa-formulario">
                <input type="text" placeholder="Nome do usuário" required>
                <i class='bx bxs-user'> </i>
            </div>

            <div class="caixa-formulario">
                <input type="password" placeholder="Senha">
                <i class='bx bxs-lock-alt'> </i>
            </div>

            <div class="caixa-lembrar-senha">
                <label><input type="checkbox"> lembrar</label>
                <a href="#"> esqueci minha senha</a>
            </div>

            <button type="submit" class="butao">Login</button>

            <div class="olink-registro">
                <p>Não tem conta <a href="#"> Entrar</a> </p>
            </div>

        </form>
    </div>    
</body>
</html>
